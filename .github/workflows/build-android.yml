name: Costruisci APK

# Parte ad ogni salvataggio su main, oppure a mano dal pulsante "Run workflow"
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # KS va dichiarato qui: il contesto secrets non e' leggibile nell'if di uno
    # step, e l'env definito dentro lo step stesso non vale per il suo if.
    env:
      KS: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Installa dipendenze
        run: npm install

      # I font vengono presi da npm: nessun download manuale sul tablet
      - name: Prepara i font
        run: |
          mkdir -p www/fonts
          cp $(find node_modules/@fontsource/archivo/files -name '*latin-700-normal.woff2' | head -1) www/fonts/Archivo-Bold.woff2
          cp $(find node_modules/@fontsource/archivo/files -name '*latin-900-normal.woff2' | head -1) www/fonts/Archivo-Black.woff2
          cp $(find node_modules/@fontsource/ibm-plex-mono/files -name '*latin-400-normal.woff2' | head -1) www/fonts/IBMPlexMono-Regular.woff2
          cp $(find node_modules/@fontsource/ibm-plex-mono/files -name '*latin-500-normal.woff2' | head -1) www/fonts/IBMPlexMono-Medium.woff2
          ls -la www/fonts

      - name: Genera il progetto Android
        run: npx cap add android

      # Icona e schermata di avvio da assets/icon.png e assets/splash.png
      - name: Genera icone e splash
        run: npx @capacitor/assets generate --android

      - name: Copia l'app nel progetto Android
        run: npx cap sync android

      # Google Play richiede targetSdk 36 dal 31 agosto 2026
      - name: Imposta targetSdk 36 e blocca la rotazione
        run: |
          sed -i 's/targetSdkVersion = .*/targetSdkVersion = 36/'  android/variables.gradle
          sed -i 's/compileSdkVersion = .*/compileSdkVersion = 36/' android/variables.gradle
          python3 - <<'PY'
          import re
          p='android/app/src/main/AndroidManifest.xml'
          s=open(p).read()
          if 'screenOrientation' not in s:
              s=re.sub(r'(<activity\b)', r'\1\n            android:screenOrientation="portrait"', s, count=1)
              open(p,'w').write(s)
              print('rotazione bloccata in verticale')
          PY
          cat android/variables.gradle

      - name: Compila l'APK di prova
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug

      - name: Pubblica l'APK
        uses: actions/upload-artifact@v4
        with:
          name: morse-trainer-apk
          path: android/app/build/outputs/apk/debug/*.apk

      # ── Pacchetto firmato per il Play Store ──
      # Si attiva da solo appena aggiungi i quattro segreti indicati nella guida
      - name: Ricostruisci il keystore
        if: env.KS != ''
        run: echo "$KS" | base64 -d > android/release.jks

      - name: Compila il bundle firmato
        if: env.KS != ''
        env:
          PW: ${{ secrets.KEYSTORE_PASSWORD }}
          AL: ${{ secrets.KEY_ALIAS }}
          AP: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file=$PWD/release.jks \
            -Pandroid.injected.signing.store.password="$PW" \
            -Pandroid.injected.signing.key.alias="$AL" \
            -Pandroid.injected.signing.key.password="$AP"

      - name: Pubblica il bundle
        if: env.KS != ''
        uses: actions/upload-artifact@v4
        with:
          name: morse-trainer-aab
          path: android/app/build/outputs/bundle/release/*.aab
